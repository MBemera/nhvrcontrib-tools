name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install-profiles:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - profile: base
            install: pip install -e .
            verify: python -c "import nhvr_mcp, nhvr_mcp.sdk, nhvr_mcp.tools, nhvr_mcp.scraper; print('base-ok')"
          - profile: cli
            install: pip install -e ".[cli]"
            verify: python -m nhvr_mcp.cli --help
          - profile: mcp
            install: pip install -e ".[mcp]"
            verify: python -c "from nhvr_mcp.server import mcp; print('mcp-ok')"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install profile
        run: ${{ matrix.install }}

      - name: Verify profile
        run: ${{ matrix.verify }}

      - name: Verify CLI knowledge command
        if: matrix.profile == 'cli'
        run: python -m nhvr_mcp.cli fatigue rules

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v

  package-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build artifacts
        run: python -m build

      - name: Validate artifacts
        run: python -m twine check dist/*

      - name: Smoke test installed wheel
        run: |
          python -m venv .package-smoke
          .package-smoke/bin/pip install dist/*.whl click fastmcp "pydantic>=2.0"
          .package-smoke/bin/python -c "import nhvr_mcp, nhvr_mcp.sdk, nhvr_mcp.tools, nhvr_mcp.scraper; print('artifact-base-ok')"
          .package-smoke/bin/python -c "from nhvr_mcp.server import mcp; print(type(mcp).__name__)"
          .package-smoke/bin/nhvr --help
          .package-smoke/bin/nhvr-setup --help
